name: threads-publish

on:
  schedule:
    # Kyiv (UTC+3): 09:00, 12:00, 19:00, 21:30
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 16 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch: {}

concurrency:
  group: threads-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish next queued post
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node scripts/publish.js
      - name: Commit queue state
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "actions@github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "publish: queue state $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin master
          git push
